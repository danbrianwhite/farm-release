name: Build and Release FlashForge Farm

on:
  workflow_dispatch:        # Manual trigger
  schedule:
    - cron: '0 0 * * 0'     # Weekly (Sunday 00:00 UTC)

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write       # Needed to create/releases and delete releases
    
    env:
      NDK_VERSION: "23.1.7779620"
      DEPS_REPO: danbrianwhite/orca-native-deps
      DEPS_ASSET: native-deps.tar.gz
      ENGINE_REPO: danbrianwhite/orca-slic3r-engine
      ENGINE_TAG: slic3r-latest
      ENGINE_ASSET: slic3r-engine.tar.gz
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch private app source (read-only)
        uses: actions/checkout@v4
        with:
          repository: danbrianwhite/flashforge-farm
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: src
          fetch-depth: 0
      
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - uses: android-actions/setup-android@v4
      
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;${NDK_VERSION}" "platforms;android-35" "cmake;3.22.1"
      
      - name: Export NDK paths
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK installed at: $NDK_PATH"
          ls "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/" | head -5
      
      - name: Download native deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download native-deps-latest --repo "$DEPS_REPO" --pattern "$DEPS_ASSET" --dir /tmp/deps --clobber
          echo "=== Native deps tarball contents ==="
          tar -tzf /tmp/deps/$DEPS_ASSET | head -20
          tar -xzf /tmp/deps/$DEPS_ASSET -C src/app/src/main
      
      - name: Download engine bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ENGINE_TAG" --repo "$ENGINE_REPO" --pattern "$ENGINE_ASSET" --dir /tmp/engine --clobber
          echo "=== Engine tarball contents ==="
          tar -tzf /tmp/engine/$ENGINE_ASSET

          # Extract engine to temp dir first
          rm -rf /tmp/engine-extract src/app/src/main/engine
          mkdir -p /tmp/engine-extract
          tar -xzf /tmp/engine/$ENGINE_ASSET -C /tmp/engine-extract --strip-components=1

          if [ ! -f /tmp/engine-extract/arm64-v8a/libslic3r.so ]; then
            echo "ERROR: libslic3r.so not found in arm64-v8a/ inside tarball"
            find /tmp/engine-extract -name "*.so" -exec ls -la {} \;
            exit 1
          fi
          file /tmp/engine-extract/arm64-v8a/libslic3r.so

          # Copy engine headers (needed by CMake to compile libfarm.so)
          mkdir -p src/app/src/main/engine/include
          cp -r /tmp/engine-extract/include/* src/app/src/main/engine/include/

          # Place libslic3r.so in ABI subdir of the engine srcDir so Gradle merge task
          # can determine the ABI. The build.gradle jniLibs.srcDirs includes
          # 'src/main/engine/arm64-v8a' — Gradle expects arm64-v8a/<file>.so inside it.
          mkdir -p src/app/src/main/engine/arm64-v8a/arm64-v8a
          cp /tmp/engine-extract/arm64-v8a/libslic3r.so src/app/src/main/engine/arm64-v8a/arm64-v8a/

          # Symlink at the path CMakeLists.txt IMPORTED_LOCATION expects
          ln -s arm64-v8a/libslic3r.so src/app/src/main/engine/arm64-v8a/libslic3r.so

          # Also place in default jniLibs path as a fallback
          mkdir -p src/app/src/main/jniLibs/arm64-v8a
          cp /tmp/engine-extract/arm64-v8a/libslic3r.so src/app/src/main/jniLibs/arm64-v8a/

          echo "=== Final engine layout ==="
          find src/app/src/main/engine -type f -o -type l | head -20

      - name: Validate staged .so files
        run: |
          echo "=== All .so files under src/main ==="
          find src/app/src/main -name "*.so" -exec ls -lh {} \;
          echo ""
          echo "=== Verify CMake can find engine ==="
          ls -lh src/app/src/main/engine/arm64-v8a/libslic3r.so
          ls -lh src/app/src/main/engine/arm64-v8a/arm64-v8a/libslic3r.so
          ls -lh src/app/src/main/jniLibs/arm64-v8a/libslic3r.so
          readelf -h src/app/src/main/jniLibs/arm64-v8a/libslic3r.so | grep Type || echo "Not a valid ELF or readelf not available"
      
      - name: Grant execute permission
        run: chmod +x src/gradlew
      
      - name: Build Release APK
        run: |
          cd src
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tail -80
      
      - name: Delete existing 'latest' release (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --repo "$GITHUB_REPOSITORY" || echo "No existing latest release to delete"
      
      - name: Create/update 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest src/app/build/outputs/apk/release/*.apk \
            --title "FlashForge Farm Latest Build" \
            --notes "Built from commit ${{ github.sha }}" \
            --repo "$GITHUB_REPOSITORY"