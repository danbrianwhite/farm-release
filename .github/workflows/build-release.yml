name: Build and Release FlashForge Farm

on:
  workflow_dispatch:        # Manual trigger
  schedule:
    - cron: '0 0 * * 0'     # Weekly (Sunday 00:00 UTC)

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write       # Needed to create/releases and delete releases
    
    env:
      NDK_VERSION: "23.1.7779620"
      DEPS_REPO: danbrianwhite/orca-native-deps
      DEPS_ASSET: native-deps.tar.gz
      ENGINE_REPO: danbrianwhite/orca-slic3r-engine
      ENGINE_TAG: slic3r-latest
      ENGINE_ASSET: slic3r-engine.tar.gz
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch private app source (read-only)
        uses: actions/checkout@v4
        with:
          repository: danbrianwhite/flashforge-farm
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: src
          fetch-depth: 0
      
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - uses: android-actions/setup-android@v4
      
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;${NDK_VERSION}" "platforms;android-35" "cmake;3.22.1"
      
      - name: Download native deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download native-deps-latest --repo "$DEPS_REPO" --pattern "$DEPS_ASSET" --dir /tmp/deps --clobber
          echo "=== Native deps tarball contents ==="
          tar -tzf /tmp/deps/$DEPS_ASSET | head -20
          tar -xzf /tmp/deps/$DEPS_ASSET -C src/app/src/main
      
      - name: Download engine bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ENGINE_TAG" --repo "$ENGINE_REPO" --pattern "$ENGINE_ASSET" --dir /tmp/engine --clobber
          echo "=== Engine tarball contents ==="
          tar -tzf /tmp/engine/$ENGINE_ASSET | head -10

          # Extract engine exactly as the private repo CI does
          rm -rf src/app/src/main/engine
          mkdir -p src/app/src/main/engine
          tar -xzf /tmp/engine/$ENGINE_ASSET -C src/app/src/main/engine --strip-components=1

          # Verify CMake-required paths
          if [ ! -f src/app/src/main/engine/arm64-v8a/libslic3r.so ]; then
            echo "ERROR: libslic3r.so not found at engine/arm64-v8a/"
            find src/app/src/main/engine -name "*.so" -exec ls -la {} \;
            exit 1
          fi
          echo "=== Engine .so ==="
          file src/app/src/main/engine/arm64-v8a/libslic3r.so
          ls src/app/src/main/engine/include/ | head -10

      - name: Validate staged .so files
        run: |
          echo "=== All .so files under src/main ==="
          find src/app/src/main -name "*.so" -exec ls -lh {} \;
          echo ""
          readelf -h src/app/src/main/engine/arm64-v8a/libslic3r.so | grep Type || echo "Not a valid ELF or readelf not available"
      
      - name: Grant execute permission
        run: chmod +x src/gradlew
      
      - name: Build Debug APK
        run: |
          cd src
          ./gradlew assembleDebug --stacktrace 2>&1 | tail -60
          exit "${PIPESTATUS[0]}"
      
      - name: Build Release APK
        run: |
          cd src
          ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/release-build.log | tail -30
          exit "${PIPESTATUS[0]}"
      
      - name: List built APKs
        run: |
          echo "=== Debug APKs ==="
          ls -lh src/app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "No debug APK"
          echo ""
          echo "=== Release APKs ==="
          ls -lh src/app/build/outputs/apk/release/*.apk 2>/dev/null || echo "No release APK"
      
      - name: Delete existing 'latest' release (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --repo "$GITHUB_REPOSITORY" || echo "No existing latest release to delete"
      
      - name: Create/update 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_FILES=$(ls src/app/build/outputs/apk/*/FlashForgeFarm_*.apk 2>/dev/null)
          if [ -z "$APK_FILES" ]; then
            echo "ERROR: No APK files found"
            find src/app/build/outputs -name "*.apk" -ls
            exit 1
          fi
          echo "Publishing APKs:"
          echo "$APK_FILES"
          gh release create latest $APK_FILES \
            --title "FlashForge Farm Latest Build" \
            --notes "Built from commit ${{ github.sha }}" \
            --repo "$GITHUB_REPOSITORY"